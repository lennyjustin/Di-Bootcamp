<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="/styles.css"><script src="/auth.js" defer></script></head>
<body><main class="page"><section class="form-card"><h1>Login :</h1><form id="login-form" novalidate><label for="username">Username</label><input id="username" name="username" minlength="3" maxlength="30" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" maxlength="72" autocomplete="current-password" required><button id="submit-button" type="submit" disabled>Login</button><p id="message" class="message" role="status" aria-live="polite"></p></form><p class="switch">New here? <a href="/register.html">Register</a></p></section></main></body></html>
