<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="/styles.css"><script src="/auth.js" defer></script></head>
<body><main class="page"><section class="form-card"><h1>Register :</h1><form id="register-form" novalidate><label for="name">First name</label><input id="name" name="name" maxlength="60" autocomplete="given-name" required><label for="lastName">Last name</label><input id="lastName" name="lastName" maxlength="60" autocomplete="family-name" required><label for="email">Email</label><input id="email" name="email" type="email" maxlength="254" autocomplete="email" required><label for="username">Username</label><input id="username" name="username" minlength="3" maxlength="30" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required><button id="submit-button" type="submit" disabled>Register</button><p id="message" class="message" role="status" aria-live="polite"></p></form><p class="switch">Already registered? <a href="/login.html">Login</a></p></section></main></body></html>
