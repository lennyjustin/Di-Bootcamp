<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coloring Squares</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎨 Coloring Squares</h1>
        <p class="instructions">Click a color, then click and drag to draw!</p>
        
        <!-- Color Palette -->
        <div class="section">
            <h2>Color Palette</h2>
            <div class="palette" id="palette"></div>
        </div>
        
        <!-- Drawing Grid -->
        <div class="section">
            <h2>Draw Here</h2>
            <div class="grid" id="grid"></div>
        </div>
        
        <!-- Clear Button -->
        <button id="clearBtn" class="clear-btn">Clear Canvas</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
