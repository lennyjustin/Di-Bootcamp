<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Quote Generator</title>
</head>
<body>
  <h1>Random Quote Generator</h1>

  <button id="generateBtn">Generate Quote</button>

  <section id="quoteSection"></section>

  <div>
    <button id="charactersBtn">Characters</button>
    <button id="charactersNoSpacesBtn">Characters without spaces</button>
    <button id="wordsBtn">Words</button>
    <button id="likeBtn">Like</button>
  </div>

  <h2>Add a Quote</h2>
  <form id="addQuoteForm">
    <input id="quoteInput" type="text" placeholder="Quote" required>
    <input id="authorInput" type="text" placeholder="Author" required>
    <button type="submit">Add Quote</button>
  </form>

  <h2>Filter by Author</h2>
  <form id="filterForm">
    <input id="authorFilter" type="text" placeholder="Author" required>
    <button type="submit">Filter</button>
  </form>

  <button id="previousBtn">Previous</button>
  <button id="nextBtn">Next</button>

  <script src="Mini project-Random Quote Generator.js"></script>
</body>
</html>
