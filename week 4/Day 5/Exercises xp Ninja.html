<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giphy Search</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 3rem clamp(1rem, 5vw, 5rem);
            color: #f8fbff;
            background: linear-gradient(-45deg, #140b2d, #1d315e, #0d5961, #32134f);
            background-size: 400% 400%;
            animation: gradientShift 18s ease infinite;
        }

        body::before {
            position: fixed;
            z-index: -1;
            inset: 0;
            content: "";
            background:
                radial-gradient(circle at 15% 20%, rgb(255 255 255 / 18%), transparent 28%),
                radial-gradient(circle at 85% 75%, rgb(117 255 233 / 15%), transparent 30%);
            pointer-events: none;
        }

        form {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
            max-width: 720px;
            padding: 1rem;
            border: 1px solid rgb(255 255 255 / 20%);
            border-radius: 1rem;
            background: rgb(255 255 255 / 10%);
            box-shadow: 0 1rem 3rem rgb(0 0 0 / 20%);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
        }

        input,
        button {
            border: 0;
            border-radius: 0.65rem;
            font: inherit;
        }

        input {
            min-width: 220px;
            flex: 1;
            padding: 0.8rem 1rem;
            color: #17203a;
            background: #ffffff;
        }

        button {
            padding: 0.8rem 1.1rem;
            color: #ffffff;
            background: #7657ff;
            cursor: pointer;
            transition: transform 180ms ease, background 180ms ease;
        }

        button:hover {
            background: #927cff;
            transform: translateY(-2px);
        }

        #delete-button {
            margin-top: 1rem;
            background: rgb(255 255 255 / 14%);
            border: 1px solid rgb(255 255 255 / 24%);
        }

        #status {
            min-height: 1.5rem;
            margin: 1rem 0 0;
            color: #d8e4ff;
        }

        #gif-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        .gif-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0.75rem;
            border: 1px solid rgb(255 255 255 / 18%);
            border-radius: 1rem;
            background: rgb(255 255 255 / 10%);
            box-shadow: 0 1rem 2rem rgb(0 0 0 / 18%);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
        }

        .gif-card img {
            width: 250px;
            height: 250px;
            border-radius: 0.65rem;
            object-fit: cover;
        }

        .error {
            color: #b00020;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body {
                animation: none;
            }

            button {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <form id="gif-form">
        <input id="search-input" type="text" placeholder="Enter a category" required>
        <button type="submit">Search</button>
    </form>

    <button id="delete-button" type="button">Delete All GIFs</button>
    <p id="status" aria-live="polite"></p>
    <div id="gif-container" aria-live="polite"></div>

    <script src="Exercises xp Ninja.js"></script>
</body>
</html>
