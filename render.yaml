services:
  - type: web
    name: daymark-assignment-tracker
    runtime: node
    plan: free
    region: ohio
    rootDir: king/assignment-tracker
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: daymark-learning-db
          property: connectionString
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: BOOTSTRAP_ADMIN_NAME
        value: Daymark administrator

databases:
  - name: daymark-learning-db
    databaseName: daymark_learning
    user: daymark_user
    plan: basic-256mb
    region: ohio
